name: Publish

# Publishes to PyPI on a GitHub Release using Trusted Publishing (OIDC) — no API
# token stored. One-time setup: add this repo as a trusted publisher for the
# `apple-health-export-mcp` project at https://pypi.org/manage/account/publishing/.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Build
        run: uv build
      - name: Publish to PyPI
        run: uv publish
